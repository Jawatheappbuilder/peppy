let category='All', cart=[];
const $=id=>document.getElementById(id); const money=n=>'$'+n.toFixed(2); const aud=n=>'A$'+n.toFixed(2);
function tabs(){const cats=['All','Peptides','Injectable Oils','Orals']; $('tabs').innerHTML=cats.map(c=>`<button class="tab ${c===category?'active':''}" onclick="category='${c}';populateProducts()">${c}</button>`).join('')}
function unitPrice(x,q,unit){if(x.category==='Injectable Oils') return unit==='kit'?(x.bulk??x.price*10):(x.price??0); return q>=10?(x.bulk??x.price):(x.price??x.bulk??0)}
function productKey(x){return `${x.category}|||${x.name}`}
function strengthLabel(x){return `${x.dosage||'Standard'}${x.inStock?'':' — OUT OF STOCK'}`}
function populateProducts(){tabs();const prev=$('productSelect').value;const groups=[];const seen=new Set();items.filter(x=>category==='All'||x.category===category).forEach(x=>{let k=productKey(x);if(!seen.has(k)){seen.add(k);groups.push({key:k,name:x.name,category:x.category})}});groups.sort((a,b)=>a.name.localeCompare(b.name)||a.category.localeCompare(b.category));$('productSelect').innerHTML=groups.map(g=>`<option value="${g.key.replace(/"/g,'&quot;')}">${g.name}${category==='All'?` — ${g.category}`:''}</option>`).join('');if(groups.some(g=>g.key===prev))$('productSelect').value=prev;populateStrengths()}
function populateStrengths(){const key=$('productSelect').value;const list=items.filter(x=>productKey(x)===key);$('strengthSelect').innerHTML=list.map(x=>`<option value="${x.code}">${strengthLabel(x)}</option>`).join('');products()}
function products(){let code=$('strengthSelect').value,x=items.find(i=>i.code===code);$('count').textContent=x?'1 selection':'';if(!x){$('products').innerHTML='<div class="empty">Choose a product and strength above.</div>';return}let p=x.price??x.bulk??0;$('products').innerHTML=`<div class="product"><div><span class="name">${x.name}</span> ${x.inStock?'':'<span class="stock">OUT OF STOCK</span>'}</div><div class="meta">${x.dosage||''} · ${x.category} · ${x.code}</div><div class="price">${x.category==='Injectable Oils'?(x.price?money(x.price)+' / vial':'')+(x.bulk?' · '+money(x.bulk)+' / kit':''):money(p)+' / kit'} <span class="aud">≈ ${aud(p*Number($('fx').value||0))}</span></div><button class="add" ${x.inStock?'':'disabled'} onclick="add('${x.code}')">${x.inStock?'Add to total':'Unavailable'}</button></div>`}
function add(code){let x=items.find(i=>i.code===code);let found=cart.find(c=>c.code===code);if(found)found.qty++;else cart.push({code,qty:1,unit:x.category==='Injectable Oils'?'vial':'kit'});drawCart()}
function setQty(code,v){let c=cart.find(x=>x.code===code);c.qty=Math.max(1,parseInt(v)||1);drawCart()}
function setUnit(code,v){cart.find(x=>x.code===code).unit=v;drawCart()}
function removeItem(code){cart=cart.filter(x=>x.code!==code);drawCart()}
function drawCart(){let fx=Number($('fx').value)||0;if(!cart.length)$('cart').innerHTML='<div class="empty">Add products above to calculate an order.</div>';else $('cart').innerHTML=cart.map(c=>{let x=items.find(i=>i.code===c.code), p=unitPrice(x,c.qty,c.unit), total=p*c.qty;return `<div class="cartrow"><div><b>${x.code} · ${x.name}</b><div class="small">${x.dosage||''}<br>${money(p)} USD each${x.category!=='Injectable Oils'&&c.qty>=10?' · 10+ pricing':''}</div></div><input class="qty" type="number" min="1" value="${c.qty}" onchange="setQty('${c.code}',this.value)">${x.category==='Injectable Oils'?`<select onchange="setUnit('${c.code}',this.value)"><option value="vial" ${c.unit==='vial'?'selected':''}>vial</option><option value="kit" ${c.unit==='kit'?'selected':''}>kit</option></select>`:'<span class="small">kits</span>'}<button class="remove" onclick="removeItem('${c.code}')">×</button><div class="lineTotal"><b>${money(total)}</b> <span class="small">≈ ${aud(total*fx)}</span></div></div>`}).join('');let subtotal=cart.reduce((s,c)=>{let x=items.find(i=>i.code===c.code);return s+unitPrice(x,c.qty,c.unit)*c.qty},0);let shipping=$('includeShip').checked?(Number($('shipping').value)||0):0;let total=subtotal+shipping;$('usd').textContent=money(total);$('aud').textContent=aud(total*fx);$('includeShip').nextSibling.textContent=` Include US$${(Number($('shipping').value)||0).toFixed(0)} shipping`}
function render(){populateProducts();drawCart()}
